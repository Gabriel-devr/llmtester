<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <!-- Aqui é uma cópia do login, mas com os ids alterados e com um novo campo "Nome" -->

        <label for="nome">Nome Completo</label>
        <input id="nome" type="text" name="nome">

        <button type="button" id="botao-entrar" onclick="window.location.href='sucesso.html'">Entrar</button>
    </form>

</body>
