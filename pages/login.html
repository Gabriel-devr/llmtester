<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login de Gabriel</title>
</head>

<body>

    <h1>Acessar Conta</h1>

    <form method="GET" action="sucesso.html">
        <div>
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" placeholder="Digite seu usuário" autocomplete="off"
                pattern="teste@gmail\.com" required>
        </div>

        <div>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" pattern="gabriel123"
                required>
        </div>

        <div>
            <button type="submit" id="btn-login" name="login_button">Entrar</button>
        </div>
    </form>

</body>

</html>
